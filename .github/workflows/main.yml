name: Testes com o Pytest

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
    #    os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
        python-version: ["3.10"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov jinja2

      - name: Rodar testes com XML
        run: |
          python -m pytest -v --cov --junitxml=resultado_testes.xml

      - name: Gerar relatório HTML
        run: |
          python gera_relatorio.py

      - name: Upload do relatório
        uses: actions/upload-artifact@v4
        with:
          name: termo-de-aceite
          path: termo_de_aceite.html

      - name: Enviar e-mail
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.email }}
          password: ${{ secrets.senhaemail }}
          subject: "Termo de Aceite Tecnico"
          to: "gustavo.luz@prof.uniso.br"
          from: "GitHub Actions"
          body: "Segue relatório de testes."
          attachments: termo_de_aceite.html
